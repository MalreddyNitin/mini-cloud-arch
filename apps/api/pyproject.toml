[project]
name = "zero-cloud-api"
version = "0.1.0"
description = "Production-shaped FastAPI backend for the Zero Cloud Stack"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.18.5",
  "boto3==1.35.99",
  "fastapi==0.141.1",
  "psycopg[binary]==3.2.10",
  "pydantic-settings==2.14.2",
  "sqlalchemy==2.0.30",
  "starlette==1.3.1",
  "uvicorn==0.52.1",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: exercises multiple application layers without production cloud services",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true
