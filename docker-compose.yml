name: zero-cloud-stack

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zero_cloud
      POSTGRES_USER: zero_cloud
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zero_cloud -d zero_cloud"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    environment:
      APP_ENV: development
      APP_ORIGIN: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      DATABASE_URL: postgresql+psycopg://zero_cloud:local-development-only@db:5432/zero_cloud
      DATABASE_URL_DIRECT: postgresql+psycopg://zero_cloud:local-development-only@db:5432/zero_cloud
      ENABLE_WRITES: "true"
      WRITE_API_KEY: ""
      DB_POOL_SIZE: "2"
      DB_MAX_OVERFLOW: "0"
      DB_CONNECT_TIMEOUT: "5"
      DB_STATEMENT_TIMEOUT_MS: "10000"
      LOG_LEVEL: INFO
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
    command: ["sh", "-c", "alembic upgrade head && exec python -m app"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    ports:
      - "127.0.0.1:8080:8080"
    init: true
    restart: unless-stopped

volumes:
  postgres-data:
